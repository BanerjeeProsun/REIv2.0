[project]
name = "rei"
version = "3.0.0"
description = "Rei v2.0 Architecture Bible Implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "keyring>=25.7.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pywin32>=312",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "import-linter",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "S"]  # flake8-bandit subset (S)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]

strict = true

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
