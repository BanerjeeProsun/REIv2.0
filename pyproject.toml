[project]
name = "rei"
version = "3.0.0"
description = "Rei v2.0 Architecture Bible Implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "faster-whisper>=1.2.1",
    "keyring>=25.7.0",
    "kokoro-onnx>=0.6.1",
    "numpy>=2.4.6",
    "onnxruntime>=1.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyside6>=6.11.2",
    "python-dotenv>=1.2.3",
    "pyttsx3>=2.99",
    "pywin32>=312",
    "qasync>=0.28.0",
    "setuptools>=84.0.0",
    "sounddevice>=0.5.6",
    "webrtcvad>=2.0.10",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "import-linter",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "S"]  # flake8-bandit subset (S)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]

strict = true

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
